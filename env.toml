[device]
DEVICE_NAME = "stallion"
'GRAPHENEOS[UPDATE_CHANNEL]' = "alpha"
# Used by multi-release.yml when its `devices` input is left empty
# DEVICES = "bluejay:sda8, panther"

[build]
# Set to "true" to rebuild the current release when a module gets an update
FORCE_UPDATE = "false"
# Build architecture, defaults to Linux. See declarations.sh for the values
# ARCH = "x86_64-unknown-linux-gnu"
# Disable a bundled module, for example BCR
# 'ADDITIONALS[BCR]' = "false"
# Root flavor for local and scheduled builds: "apatch", "magisk", or "rootless"
ROOT = "apatch"
# Magisk preinit device for your device (required only when ROOT = "magisk"), for example "sda8"
MAGISK_PREINIT = "sda10"
# SuperKey for APatch (8-63 alphanumeric characters with both letters and numbers)
# Can also be set via the APATCH_SUPERKEY GitHub secret
# APATCH_SUPERKEY = "MySuperKey123"

[github]
# Set these when running a fork, used for the OTA server URL
GITHUB_USER = "Finnyus"
GITHUB_REPO = "PixeneOS"
# Magisk source, defaults to pixincreate/Magisk with Zygisk fixes for GrapheneOS
# 'MAGISK[REPOSITORY]' = "topjohnwu/Magisk"
